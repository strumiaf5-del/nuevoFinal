<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a14">
  <meta content="7.0.3" name="app-version" data-deploy="2026-09-15">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com; style-src 'self' https://fonts.googleapis.com; style-src-elem 'self' https://releases.transloadit.com https://fonts.googleapis.com; style-src-attr 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' https://masteringstudio.duckdns.org wss://masteringstudio.duckdns.org https://masteringstudio-api.duckdns.org wss://masteringstudio-api.duckdns.org; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests"/>
  <title>Acceso · LGMDM Studio</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" integrity="sha384-+77BHp2XiYVKWuHwdGUgHSmWVeR52WlHvDFfsCo/wiQ5MhrderTHusJz0IWbX4nR">
  <link href="css/base/tokens.css" rel="stylesheet" integrity="sha384-FSBASLQF2FNPcm3y1IEEdt5kenDkCqVcEKFAKkb1DwyVM0nju61Xp1eZSfjQaeYo" crossorigin="anonymous"/>
  <link href="css/base/themes.css" rel="stylesheet" integrity="sha384-U7c2VKFfi+8LjbbNz3L+b1OIXGQdpegnnRCXdOi/9D2lBco0obFdNVP92yxe4b/8" crossorigin="anonymous"/>
  <link href="css/base/themes-professional.css" rel="stylesheet" integrity="sha384-HXwDxZsk88+fVCDRz2GhzlfhlLzQRRMpu1RWWeg6aNgYEG/r/sPhpT2E/iRQe5HO" crossorigin="anonymous"/>
  <link href="css/login-inline.css" rel="stylesheet" integrity="sha384-8h5ozL6OMzPcnywGKWM8xyIxz+z9grlDBpBimbVxdrRGdNzdzpHlj+praasPDaj1" crossorigin="anonymous"/>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="brand-header">
        <div class="brand-logo">
          <span class="icon">🎚</span>
          <span>MASTER Studio</span>
        </div>
        <span class="brand-subtitle">INTELLIGENT MASTERING CONSOLE</span>
      </div>

      <div class="auth-tabs" role="tablist">
        <button class="auth-tab active" id="tab-login" type="button" role="tab" aria-selected="true" aria-controls="form-login">Iniciar sesión</button>
        <button class="auth-tab" id="tab-register" type="button" role="tab" aria-selected="false" aria-controls="form-register">Registrarse</button>
      </div>

      <!-- Login Form -->
      <div id="form-login" class="auth-form" role="tabpanel" aria-labelledby="tab-login">
        <form id="form-login-real" class="auth-form-inner" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-email">Correo electrónico</label>
            <input type="email" id="login-email" class="form-input" placeholder="tu@email.com" autocomplete="email" required autofocus>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-pwd">Contraseña</label>
            <input type="password" id="login-pwd" class="form-input" placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <button type="submit" class="auth-submit-btn" id="login-btn">Ingresar a la consola</button>
          <div id="login-msg" class="auth-msg hidden" role="alert"></div>
        </form>
      </div>

      <!-- Register Form -->
      <div id="form-register" class="auth-form hidden" role="tabpanel" aria-labelledby="tab-register">
        <form id="form-register-real" class="auth-form-inner" novalidate>
          <div class="form-group">
            <label class="form-label" for="reg-name">Nombre completo</label>
            <input type="text" id="reg-name" class="form-input" placeholder="Tu nombre" autocomplete="name">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-email">Correo electrónico</label>
            <input type="email" id="reg-email" class="form-input" placeholder="tu@email.com" autocomplete="email" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-pwd">Contraseña</label>
            <input type="password" id="reg-pwd" class="form-input" placeholder="Mínimo 8 caracteres" autocomplete="new-password" required minlength="8">
          </div>
          <button type="submit" class="auth-submit-btn" id="register-btn">Crear cuenta</button>
          <div id="reg-msg" class="auth-msg hidden" role="alert"></div>
        </form>
      </div>

      <div class="footer-note">
        Audio Mastering Pro v7.0.3 · Plataforma privada de masterización
      </div>
    </div>
  </div>

  <script src="js/login-inline.js" integrity="sha384-RDK2RJCZy4b36oIi0CxPjtl3IpEY50SW4r9n82Il08you6Iq/ILC42bE7hdeqO/8" crossorigin="anonymous"></script>
</body>
</html>
